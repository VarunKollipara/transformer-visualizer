[project]
name = "transformer-visualizer"
version = "0.1.0"
description = "A from-scratch, character-level GPT-style transformer with an interactive web visualizer."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.138.0",
    "numpy>=1.26",
    "torch>=2.12.1",  # core ML library: tensors, autograd, the neural-net layers
    "uvicorn[standard]>=0.49.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
# uv manages its own Python (see .python-version) and the .venv for us.
